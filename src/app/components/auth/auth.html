<h2>Page d'authentification / inscription</h2>
<div>
  <button [class.active]="mode === 'login'" (click)="switchMode('login')">Se connecter</button>
  <button [class.active]="mode === 'signup'" (click)="switchMode('signup')">Créer un compte</button>
</div>

@if (mode === 'login') {
  <form (ngSubmit)="seConnecter()" #loginForm="ngForm">
      <div>
          <label for="username">Identifiant</label>
          <input type="text" id="username" [(ngModel)]="user.username" name="username">
      </div>
      <div>
          <label for="password">Mot de passe</label>
          <input type="password" id="password" [(ngModel)]="user.password" name="password">
      </div>

      <div>
          <button class="btn">
              <i class="fa-solid fa-right-to-bracket"></i>
          </button>
      </div>
  </form>
}

@else {
  <form #signupForm="ngForm" (ngSubmit)="creerCompte(signupForm)">
      <div>
          <label for="username">Identifiant</label>
          <input type="text" id="username" [(ngModel)]="user.username" name="username">
      </div>
      <div>
          <label for="password">Mot de passe</label>
          <input type="password" id="password" [(ngModel)]="user.password" name="password">
      </div>
          <div>
          <label for="confirmPassword">Confirmer le mot de passe</label>
          <input type="password" id="confirmPassword" [(ngModel)]="confirmPassword" name="confirmPassword">
      </div>

      <div>
          <button class="btn" type="submit">
              Créer mon compte
          </button>
      </div>
  </form>
}
@if (erreur) {
<div class="row alert alert-danger">
    {{ erreur }}
</div>
}
