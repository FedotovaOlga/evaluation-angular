<h3>Ajouter une nouvelle formation</h3>
<div>
  <input type="text" placeholder="Titre" [(ngModel)]="formation.titre">
  <input type="date" placeholder="Date de début" [(ngModel)]="formation.dateDebut">
  <input type="number" placeholder="Durée (nombre de jours)" [(ngModel)]="formation.duree">
  <button class="btn" (click)="ajouter()">
    <i class="fa-solid fa-plus"></i>
  </button>
</div>
<h3>Liste des formations</h3>
<ul>
  @for (f of formations; track $index) {
  <app-formation [formation]="f" />
  <button class="text-danger btn" (click)="supprimer($index, f.id)">
    <i class="fa-solid fa-trash-can"></i>
  </button>
  }
</ul>
