<div class="row justify-content-center">
  <div class="col-lg-8">
    <h1 class="text-center mb-3">Liste des formations</h1>
    <ul  class="list-group">
      @for (f of formations; track $index) {
      <li class="list-group-item d-flex justify-content-between align-items-center">
        <app-formation [formation]="f" />
      </li>
      }
      <div class="mt-4">

        @if (isLoggedIn$ | async) {
        <button class="btn btn-primary w-100" routerLink="/formations">
          Gérer les formations
        </button>
        }
        @else {
        <button class="btn btn-primary w-100" routerLink="/auth">
          Se connecter pour gérer les formations
        </button>
        }
      </div>

      </ul>
  </div>
</div>
